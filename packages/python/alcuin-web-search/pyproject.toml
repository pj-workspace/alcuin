[project]
name = "alcuin-web-search"
version = "0.1.0"
description = "Provider-neutral bounded public web retrieval for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "alcuin-core",
  "httpx>=0.27.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_web_search"]

[tool.uv.sources]
alcuin-core = { path = "../alcuin-core", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
