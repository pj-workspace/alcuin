[project]
name = "alcuin-core"
version = "0.1.0"
description = "Framework-neutral contracts for the Alcuin agent platform"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0,<5.0",
  "pydantic>=2.9.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_core"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.3.0,<9.0"]
