[project]
name = "alcuin-customization"
version = "0.1.0"
description = "Provider-neutral Rules, Agent Skills, and plugin import contracts for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "alcuin-core",
  "pyyaml>=6.0.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_customization"]

[tool.uv.sources]
alcuin-core = { path = "../alcuin-core", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
