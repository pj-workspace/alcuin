[project]
name = "alcuin-knowledge"
version = "0.1.0"
description = "Workspace-scoped document ingestion and hybrid retrieval for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "alcuin-core",
  "alcuin-documents",
  "alcuin-storage",
  "httpx>=0.27.0,<1.0",
  "qdrant-client>=1.14.2,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_knowledge"]

[tool.uv.sources]
alcuin-core = { path = "../alcuin-core", editable = true }
alcuin-documents = { path = "../alcuin-documents", editable = true }
alcuin-storage = { path = "../alcuin-storage", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
