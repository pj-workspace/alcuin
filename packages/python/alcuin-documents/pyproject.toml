[project]
name = "alcuin-documents"
version = "0.1.0"
description = "Bounded, provider-neutral document parsing and export for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.0.0,<7.0",
  "python-docx>=1.1.2,<2.0",
  "markdown-it-py>=3.0.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_documents"]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
