[project]
name = "alcuin-context"
version = "0.1.0"
description = "Provider-neutral context assembly and compaction contracts for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "alcuin-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_context"]

[tool.uv.sources]
alcuin-core = { path = "../alcuin-core", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
