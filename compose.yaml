services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${ALCUIN_POSTGRES_USER:-alcuin}
      POSTGRES_PASSWORD: ${ALCUIN_POSTGRES_PASSWORD:-alcuin}
      POSTGRES_DB: ${ALCUIN_POSTGRES_DB:-alcuin}
    ports:
      - "127.0.0.1:${ALCUIN_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
