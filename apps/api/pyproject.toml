[project]
name = "alcuin-api"
version = "0.1.0"
description = "Control plane and runtime gateway for Alcuin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "httpx>=0.27.0,<1.0",
  "jsonschema>=4.23.0,<5.0",
  "langgraph>=0.2.0,<2.0",
  "mcp>=1.0.0,<2.0",
  "pydantic-settings>=2.5.0,<3.0",
  "pyyaml>=6.0.0,<7.0",
  "qdrant-client>=1.14.2,<2.0",
  "uvicorn[standard]>=0.30.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
]
