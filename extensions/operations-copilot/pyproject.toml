[project]
name = "alcuin-operations-copilot"
version = "0.1.0"
description = "Explicit Operations Copilot example Extension for Alcuin"
requires-python = ">=3.11"
dependencies = ["alcuin-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcuin_operations_copilot"]

[tool.uv.sources]
alcuin-core = { path = "../../packages/python/alcuin-core", editable = true }
